version: 2

models:
  - name: dim_product
    description: Product dimension, including a placeholder for unattributed sales.
    columns:
      - name: product_id
        description: Product primary key; UNATTRIBUTED represents sales with no product ID.
        tests:
          - not_null
          - unique

  - name: dim_geography
    description: Geography dimension keyed by geography_id.
    columns:
      - name: geography_id
        description: Geography primary key.
        tests:
          - not_null
          - unique

  - name: dim_date
    description: Daily date dimension keyed by date_day.
    columns:
      - name: date_day
        description: Calendar date primary key.
        tests:
          - not_null
          - unique

  - name: fct_sales
    description: One row per staged sales transaction; returns and repeated sales IDs are retained.
    columns:
      - name: product_id
        description: Product foreign key; null source product IDs are mapped to UNATTRIBUTED.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: geography_id
        description: Geography foreign key.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_id
      - name: month
        description: Sales date key; sales months are stored on the first day of the month.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_crm
    description: One row per source CRM interaction with completed-activity indicator.
    columns:
      - name: interaction_id
        description: Source identifier for the CRM interaction.
      - name: interaction_date
        description: Source date of the CRM interaction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: geography_id
        description: Geography identifier for calendar, market, and currency lookup in results models.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_id
      - name: product_id
        description: Product dimension key; null source values map to UNATTRIBUTED.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: completed_interaction_count
        description: One for Completed interactions and zero for other statuses.