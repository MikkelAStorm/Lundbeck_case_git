version: 2

models:
  - name: sales_annual__market_product
    description: >-
      Annual units and local-currency sales by market and product for 2023-2025,
      including unit changes and growth/decline ranks within each market for
      2025 versus 2024. Currency remains part of the grain; currencies are not
      combined. Year-specific columns must be updated when adding a new year.
    columns:
      - name: market_code
        description: Market used to scope the year-over-year product ranks.
      - name: product_id
        description: Product dimension key, including UNATTRIBUTED when source ID was null.
      - name: product_name
        description: Product name from the product dimension.
      - name: currency_code
        description: Local currency for net sales; do not aggregate sales across currencies.
      - name: units_change_2025_vs_2024
        description: Absolute change in units from 2024 to 2025.
      - name: units_change_pct_2025_vs_2024
        description: Percentage change in units from 2024 to 2025; null when 2024 units are zero or absent.
      - name: units_growth_rank_2025_vs_2024
        description: Rank within market by largest positive absolute unit change.
      - name: units_decline_rank_2025_vs_2024
        description: Rank within market by largest negative absolute unit change.